[alembic]
script_location = migrations
# the URL is set from `DATABASE_URL` in migrations/env.py, or by remote_imap_mail_rules.db.migrate

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
