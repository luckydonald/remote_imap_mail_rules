[project]
name = "remote-imap-mail-rules"
version = "0.1.0"
description = "Run mail rules via IMAP, independent of the provider."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioimaplib>=2.0.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_imap_mail_rules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
